<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Viaenterpriseofficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/components/navbar.css">
    <link rel="stylesheet" href="assets/css/components/footer.css">
    <link rel="stylesheet" href="assets/css/components/cart.css">
    <link rel="stylesheet" href="assets/css/pages/auth.css">
</head>
<body>
    <div id="navbar-container"></div>

    <main class="auth-page">
        <section class="auth-card">
            <div class="brand-side">
                <h1>Welcome Back</h1>
                <p>Log in to access exclusive deals, track orders, and more.</p>
                <ul class="perks">
                    <li><i class="fas fa-check"></i> Faster checkout</li>
                    <li><i class="fas fa-check"></i> Wishlist sync</li>
                    <li><i class="fas fa-check"></i> Personalized offers</li>
                </ul>
            </div>
            <div class="form-side">
                <h2>Sign in</h2>
                <form id="loginForm" action="login.php" method="POST" novalidate>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                        <small class="error"></small>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <div class="password-wrap">
                            <input type="password" id="password" name="password" placeholder="••••••••" required>
                            <button type="button" class="toggle-pass" aria-label="Show password"><i class="far fa-eye"></i></button>
                        </div>
                        <small class="error"></small>
                    </div>
                    <button type="submit" class="auth-btn">Login</button>
                    <p class="switch">New here? <a href="register.html">Create an account</a></p>
                </form>
            </div>
        </section>
    </main>


    <script src="assets/js/auth.js"></script>
    <script src="assets/js/components/cart.js"></script>
    <script>
        // Load navbar
        fetch('components/navbar.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('navbar-container').innerHTML = html;
                const script = document.createElement('script');
                script.src = 'assets/js/components/navbar.js';
                document.body.appendChild(script);
                
                // Initialize cart after navbar is loaded
                setTimeout(() => {
                    if (typeof CartManager !== 'undefined') {
                        cartManager = new CartManager();
                        console.log('Cart initialized after navbar load');
                    } else {
                        console.error('CartManager not found');
                    }
                }, 200);
            });
    </script>
</body>
</html>
