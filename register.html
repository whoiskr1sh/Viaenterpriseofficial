<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Clothing</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/components/navbar.css">
    <link rel="stylesheet" href="assets/css/components/cart.css">
    <link rel="stylesheet" href="assets/css/pages/auth.css">
</head>
<body>
    <div id="navbar-container"></div>

    <main class="auth-page">
        <section class="auth-card">
            <div class="brand-side">
                <h1>Create Account</h1>
                <p>Join us to get personalized offers and faster checkout.</p>
                <ul class="perks">
                    <li><i class="fas fa-check"></i> Exclusive sale alerts</li>
                    <li><i class="fas fa-check"></i> Save your wishlist</li>
                    <li><i class="fas fa-check"></i> Track your orders</li>
                </ul>
            </div>
            <div class="form-side">
                <h2>Register</h2>
                <form id="registerForm" action="register.php" method="POST" novalidate>
                    <div class="field">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Your name" required>
                        <small class="error"></small>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                        <small class="error"></small>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <div class="password-wrap">
                            <input type="password" id="password" name="password" placeholder="At least 8 chars, 1 uppercase & 1 number" required>
                            <button type="button" class="toggle-pass" aria-label="Show password"><i class="far fa-eye"></i></button>
                        </div>
                        <small class="error"></small>
                    </div>
                    <div class="field">
                        <label for="confirm">Confirm Password</label>
                        <div class="password-wrap">
                            <input type="password" id="confirm" name="confirm" placeholder="Re-enter password" required>
                            <button type="button" class="toggle-pass" aria-label="Show password"><i class="far fa-eye"></i></button>
                        </div>
                        <small class="error"></small>
                    </div>
                    <button type="submit" class="auth-btn">Create Account</button>
                    <p class="switch">Already have an account? <a href="login.html">Login</a></p>
                </form>
            </div>
        </section>
    </main>


    <script src="assets/js/auth.js"></script>
    <script src="assets/js/components/cart.js"></script>
    <script>
        // Load navbar
        fetch('components/navbar.html')
          .then(r => r.text())
          .then(html => {
            document.getElementById('navbar-container').innerHTML = html;
            const s = document.createElement('script');
            s.src = 'assets/js/components/navbar.js';
            document.body.appendChild(s);
            
            // Initialize cart after navbar is loaded
            setTimeout(() => {
              if (typeof CartManager !== 'undefined') {
                cartManager = new CartManager();
                console.log('Cart initialized after navbar load');
              } else {
                console.error('CartManager not found');
              }
            }, 200);
          });
        
    </script>
</body>
</html>
