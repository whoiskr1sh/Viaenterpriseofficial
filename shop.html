<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Viaenterpriseofficial</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/components/navbar.css">
    <link rel="stylesheet" href="assets/css/components/footer.css">
    <link rel="stylesheet" href="assets/css/components/cart.css">
    <link rel="stylesheet" href="assets/css/pages/shop.css">
</head>
<body>
    <!-- Navbar Component -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="shop-page">
        <!-- Page Header -->
        <div class="page-header">
            <h1>Our Products</h1>
            <nav class="breadcrumb">
                <a href="index.html">Home</a> / <span>Shop</span>
            </nav>
        </div>

        <div class="shop-container">
            <!-- Mobile Filter Toggle Button -->
            <button class="mobile-filter-toggle">
                <i class="fas fa-filter"></i>
                Filters & Sort
            </button>
            
            <!-- Mobile Sort Section -->
            <div class="mobile-sort-section">
                <h3>Quick Sort</h3>
                <select id="mobileSortBy" class="sort-select">
                    <option value="featured">Featured</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                    <option value="newest">Newest Arrivals</option>
                    <option value="rating">Highest Rated</option>
                </select>
            </div>
            
            <!-- Sidebar Filters -->
            <aside class="sidebar">
                <div class="filter-section">
                    <h3>Categories</h3>
                    <div class="filter-options">
                        <label class="filter-option">
                            <input type="checkbox" name="category" value="ethnic" checked>
                            <span>Cargo</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" name="category" value="jewelry" checked>
                            <span>Denim Jeans</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" name="category" value="accessories" checked>
                            <span>Trousers</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" name="category" value="hampers" checked>
                            <span>Joggers</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" name="category" value="lifestyle" checked>
                            <span>Formal Trousers</span>
                        </label>
                    </div>
                </div>

                <div class="filter-section">
                    <h3>Price Range</h3>
                    <div class="price-range">
                        <div class="range-inputs">
                            <input type="number" id="minPrice" placeholder="Min" min="0">
                            <span>to</span>
                            <input type="number" id="maxPrice" placeholder="Max">
                        </div>
                        <button id="applyPriceFilter" class="btn btn-primary">Apply</button>
                    </div>
                </div>

                <div class="filter-section">
                    <h3>Sort By</h3>
                    <select id="sortBy" class="sort-select">
                        <option value="featured">Featured</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="newest">Newest Arrivals</option>
                        <option value="rating">Highest Rated</option>
                    </select>
                </div>

                <button id="resetFilters" class="btn btn-primary reset-btn">Reset Filters</button>
            </aside>

            <!-- Products Grid -->
            <div class="products-grid">
                <!-- Ethnic Wear Section -->
                <section class="category-section" data-category="ethnic">
                    <h2 class="category-title">Cargo</h2>
                    
                    <!-- Sarees Subcategory -->
                    <div class="subcategory-section" data-subcategory="sarees">
                       
                        <div class="products-row">
                            <!-- Product cards will be generated here by JavaScript -->
                        </div>
                    </div>
                    
                    <!-- Lehengas Subcategory -->
                    <div class="subcategory-section" data-subcategory="lehengas">
                        
                        <div class="products-row">
                            <!-- Product cards will be generated here by JavaScript -->
                        </div>
                    </div>
                    
                    <!-- Kurtis Subcategory -->
                    <div class="subcategory-section" data-subcategory="kurtis">
                      
                        <div class="products-row">
                            <!-- Product cards will be generated here by JavaScript -->
                        </div>
                    </div>
                </section>

                <!-- Jewelry Section -->
                <section class="category-section" data-category="jewelry">
                    <h2 class="category-title">Denim Jeans</h2>
                    
                    <!-- Necklaces Subcategory -->
                    <div class="subcategory-section" data-subcategory="necklaces">
                       
                        <div class="products-row">
                            <!-- Product cards will be generated here by JavaScript -->
                        </div>
                    </div>
                    
                    <!-- Earrings Subcategory -->
                    <div class="subcategory-section" data-subcategory="earrings">
                        
                        <div class="products-row">
                            <!-- Product cards will be generated here by JavaScript -->
                        </div>
                    </div>
                    
                    <!-- Bangles Subcategory -->
                    <div class="subcategory-section" data-subcategory="bangles">
                        
                        <div class="products-row">
                            <!-- Product cards will be generated here by JavaScript -->
                        </div>
                    </div>
                </section>

                <!-- Accessories Section -->
                <section class="category-section" data-category="accessories">
                    <h2 class="category-title">Trousers</h2>
                    
                    <!-- Bags Subcategory -->
                    <div class="subcategory-section" data-subcategory="bags">
                        
                        <div class="products-row">
                            <!-- Product cards will be generated here by JavaScript -->
                        </div>
                    </div>
                    
                    <!-- Footwear Subcategory -->
                    <div class="subcategory-section" data-subcategory="footwear">
                        
                        <div class="products-row">
                            <!-- Product cards will be generated here by JavaScript -->
                        </div>
                    </div>
                    
                    <!-- Watches Subcategory -->
                    <div class="subcategory-section" data-subcategory="watches">
                        
                        <div class="products-row">
                            <!-- Product cards will be generated here by JavaScript -->
                        </div>
                    </div>
                </section>

                <!-- Lifestyle & Essentials Section -->
                <section class="category-section" data-category="lifestyle">
                    <h2 class="category-title">Formal Trousers</h2>
                    
                    <!-- Stationery Subcategory -->
                    <div class="subcategory-section" data-subcategory="stationery">
                       
                        <div class="products-row">
                            <!-- Product cards will be generated here by JavaScript -->
                        </div>
                    </div>
                    
                    <!-- Cosmetics Subcategory -->
                    <div class="subcategory-section" data-subcategory="cosmetics">
                        
                        <div class="products-row">
                            <!-- Product cards will be generated here by JavaScript -->
                        </div>
                    </div>
                </section>

                 <!-- Hampers & Gifts Section -->
                <section class="category-section" data-category="hampers">
                    <h2 class="category-title">Joggers</h2>
                    <!-- Optimized Hamper Subcategory -->
                    <div class="subcategory-section" data-subcategory="optimized_hampers">
                       
                        <div class="products-row">
                            <!-- Product cards will be generated here by JavaScript -->
                        </div>
                    </div>
                    
                    <!-- Gift Hamper Subcategory -->
                    <div class="subcategory-section" data-subcategory="gift_hampers">
                      
                        <div class="products-row">
                            <!-- Product cards will be generated here by JavaScript -->
                        </div>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <!-- Footer Component -->
    <footer class="site-footer" id="site-footer">
        <!-- Footer content will be loaded from components/footer.html -->
    </footer>

    <!-- JavaScript -->
    <script src="assets/js/shop.js"></script>
    <script src="assets/js/components/wishlist.js"></script>
    <script src="assets/js/components/cart.js"></script>
    <script>
        // Load footer component
        fetch('components/footer.html')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to load footer');
                }
                return response.text();
            })
            .then(html => {
                const footer = document.getElementById('site-footer');
                if (footer) {
                    footer.innerHTML = html;
                } else {
                    console.error('Footer container not found');
                }
            })
            .catch(error => {
                console.error('Error loading footer:', error);
            });
    </script>
    <script>
        // Load navbar component
        fetch('components/navbar.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('navbar-container').innerHTML = html;
                
                // Load and initialize navbar JS only once
                if (!window.navbarInitialized) {
                    const script = document.createElement('script');
                    script.src = 'assets/js/components/navbar.js';
                    script.onload = function() {
                        // Initialize navbar after script loads
                        if (typeof initializeNavbar === 'function') {
                            initializeNavbar();
                            window.navbarInitialized = true;
                        }
                        
                        // Initialize cart after navbar is loaded
                        setTimeout(() => {
                            if (typeof CartManager !== 'undefined') {
                                cartManager = new CartManager();
                                console.log('Cart initialized after navbar load');
                            } else {
                                console.error('CartManager not found');
                            }
                        }, 200);
                    };
                    document.body.appendChild(script);
                } else {
                    // Navbar already initialized, just initialize cart
                    setTimeout(() => {
                        if (typeof CartManager !== 'undefined') {
                            cartManager = new CartManager();
                            console.log('Cart initialized after navbar load');
                        }
                    }, 200);
                }
            });
    </script>
</body>
</html>
